<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Citadel Video Service</title>
    <link rel="icon" type="image/png" href="../icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }

      video {
        display: block;
        box-sizing: border-box;
        width: calc(100% - 32px);
        height: calc(100% - 32px);
        margin: 16px;
        border: 8px solid #272727;
        box-shadow: 0 0 0 1px #444, 0 12px 40px rgba(0, 0, 0, 0.7);
        object-fit: contain;
      }

      .brand-icon {
        position: fixed;
        z-index: 1;
        top: 28px;
        left: 28px;
        width: 32px;
        height: 32px;
        object-fit: contain;
        filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.8));
      }

      .brand-label {
        position: fixed;
        z-index: 1;
        top: 28px;
        left: 68px;
        display: flex;
        align-items: center;
        height: 32px;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <img
      class="brand-icon"
      src="../icon.png"
      alt="Citadel icon"
      onerror="this.onerror=null; this.src='https://i.postimg.cc/kXcpSJW0/nopfp.png';"
    />
    <span class="brand-label">Citadel Video Service</span>
    <video controls playsinline preload="metadata">
      <source src="verify.mp4" type="video/mp4" />
      Your browser does not support HTML video.
    </video>
  </body>
</html>
